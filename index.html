<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2f5"><title>Akcja Kompas 💗</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#432b3b;background:#fff7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 12%,#ffe0eb 0,transparent 35%),radial-gradient(circle at 90% 80%,#f2e5ff 0,transparent 35%),#fff9f5}.wrap{max-width:620px;margin:auto;padding:26px 18px 60px}.top{text-align:center;font-size:13px;font-weight:800;letter-spacing:2px;color:#b65c82;margin:16px 0 25px}.panel{background:#ffffffdf;border:1px solid #fff;box-shadow:0 18px 65px #b9708a24;border-radius:30px;padding:clamp(22px,6vw,42px);position:relative;overflow:hidden}.eyebrow{color:#b65c82;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(32px,8vw,49px);line-height:1.13;margin:14px 0}h2{font-size:clamp(25px,6vw,34px);line-height:1.2;margin:12px 0 18px}p{line-height:1.7;color:#76586b}.center{text-align:center}.big{font-size:65px;margin:5px}.btn{border:0;border-radius:16px;background:#e877a5;color:white;font:inherit;font-weight:800;padding:15px 21px;cursor:pointer;box-shadow:0 7px 18px #d76b9633;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-2px);background:#dc6396}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.secondary{background:#fff0f5;color:#a34c77;box-shadow:none}.secondary:hover{background:#ffe3ee}.actions{display:flex;gap:10px;margin-top:22px}.actions .btn:last-child{flex:1}.option{width:100%;display:block;text-align:left;background:#fff;border:2px solid #f6e3ec;border-radius:17px;padding:15px 17px;font:inherit;color:#543748;cursor:pointer;margin:10px 0;transition:all .15s}.option:hover{border-color:#e9a2bd;transform:translateY(-1px)}.option.selected{border-color:#df6d9b;background:#fff0f5;font-weight:700}.reaction{background:#fff0f5;border-radius:16px;padding:16px;margin:16px 0;animation:appear .3s ease}.progress{display:flex;gap:5px;margin:15px 0 26px}.progress span{height:7px;flex:1;border-radius:20px;background:#f5dfeb}.progress span.done{background:#e877a5}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.calendar-head button{padding:9px 13px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:15px 0}.dayname{text-align:center;font-size:12px;color:#aa7d95}.day{border:0;border-radius:12px;background:#fff1f6;min-height:42px;color:#5c4050;font:inherit;cursor:pointer}.day:disabled{background:transparent;color:#d5c8cf;cursor:default}.day.selected{background:#e877a5;color:#fff;font-weight:800}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slots .option{margin:0;text-align:center;padding:12px 6px;font-size:14px}.mini{font-size:13px;color:#8b6c7d}.picked{background:#fff5f8;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer}.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cardgrid .option{margin:0;text-align:center;min-height:116px}.emoji{font-size:29px;display:block;margin-bottom:7px}.summary{background:#fff2f7;padding:17px;border-radius:17px;margin:16px 0;overflow-wrap:anywhere}.summary div{margin:8px 0}.field{width:100%;border:2px solid #f3dce8;border-radius:14px;padding:13px;font:inherit;background:white;color:#432b3b}.hidden{display:none}.error{color:#b52e57;font-size:14px}.success{color:#34765a}.footer{text-align:center;color:#ae839a;font-size:12px;margin-top:25px}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:390px){.wrap{padding:15px 11px}.panel{padding:20px}.day{min-height:36px;font-size:13px}.calendar{gap:3px}}

.photo{display:block;width:100%;max-height:390px;object-fit:cover;object-position:center 30%;border-radius:22px;box-shadow:0 14px 35px #472a3b25;margin:16px auto}.photo.sleep{max-height:340px;object-position:center 38%}.photo.small{max-height:235px}.sparkle{font-size:38px;animation:bounce 1.8s infinite alternate}.reveal{animation:appear .55s ease}.warning{background:#fff0ee;border:2px dashed #ee8b91;padding:14px;border-radius:18px;text-align:center}.time-row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.time-row label{flex:1;min-width:110px;font-size:13px;font-weight:700}.time-row input{margin-top:6px}.time-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{border:1px solid #eaa0bb;border-radius:40px;background:#fff0f5;padding:8px 10px;font:inherit;font-size:13px;color:#803b5b;cursor:pointer}.compass{display:inline-block;font-size:75px;animation:spinCompass 2.5s cubic-bezier(.18,.7,.22,1) both}@keyframes spinCompass{0%{transform:rotate(-60deg) scale(.7)}70%{transform:rotate(780deg) scale(1.15)}100%{transform:rotate(720deg) scale(1)}}@keyframes bounce{to{transform:translateY(-9px) rotate(6deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.photo {

}</style></head><body><main class="wrap"><div class="top">🧭 AKCJA KOMPAS 💗</div><section class="panel" id="app" aria-live="polite"></section><div class="footer">Stworzone z uśmiechem. I odrobiną podejrzanych intencji. 👀</div></main><script>
'use strict';
// Wklej adres wdrożonej aplikacji Google Apps Script (kończący się na /exec).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybMmA40Zd8AkzJSd84hLQLtdy8AJQQjh5J2f65_1ozVpENFHSxdv-EZciInbs__FOT/exec';
const questions=[
{q:'Czy ananas na pizzy powinien być legalny? 🍍',a:['Tak, i nie zamierzam dyskutować','Nie, natychmiastowy zakaz','Zależy, kto stawia pizzę'],r:['Odważna deklaracja. Włosi właśnie zamknęli granice. 🇮🇹😂','Ministerstwo Pizzy zatwierdza tę odpowiedź. 🍕','Czyli jednak istnieje sposób, żeby Cię przekonać… zapisuję. 📝😏']},
{q:'Gdybyś była ziemniakiem, to jakim? 🥔',a:['Frytką premium','Eleganckim puree','Ziemniakiem z charakterem'],r:['Frytka premium? Czyli wysoka jakość i zero promocji. 💅','Puree z klasą. Restauracje Michelin już dzwonią. ⭐','Ziemniak z charakterem? Brzmi jak ktoś, z kim nie warto się kłócić. 😂']},
{q:'Ile czasu potrzebujesz, żeby się wyszykować? 💅',a:['15 minut (podobno)','Godzinka','Nie zadawaj trudnych pytań'],r:['15 minut? Dobrze, ustawię sobie przypomnienie za 45. 😂','Godzinka… czyli w tłumaczeniu jakieś półtorej? ⏰','Przepraszam, nie chciałem poruszać tak drażliwego tematu. 😭']},
{q:'Co robisz, kiedy ktoś opowiada suchara? 😂',a:['Śmieję się z litości','Opowiadam jeszcze gorszy','Patrzę z rozczarowaniem'],r:['Idealnie, moje żarty mają zapewnioną publiczność. 😎','O nie… dwa chodzące suchary. To może być niebezpieczne. 😂','To ja chyba zacznę przygotowywać lepszy repertuar. 📝']},
{q:'Jak oceniasz swoje umiejętności wychodzenia z labiryntów? 👻',a:['Profesjonalistka','To zależy od towarzystwa','Nie chcę o tym rozmawiać'],r:['Potwierdzam. Z labiryntu wyszłaś, ale trafiłaś na ten quiz. 😂','Ciekawa odpowiedź… bardzo ciekawa. 👀❤️','Rozumiem. Wspomnienia z soboty nadal są zbyt świeże. 👻']},
{q:'Czy uważasz, że przypadkowe spotkania są naprawdę przypadkowe? 👀',a:['Tak','Nie do końca','Podejrzane pytanie'],r:['Czyli kolega z pracy przypadkiem został organizatorem całej tej historii. 😂','Też mam wrażenie, że niektóre przypadki są całkiem fajne. 😏','Spokojnie, to tylko niewinny quiz. Absolutnie niczego nie sugeruję. 🤫']},
{q:'Czy istnieje coś lepszego niż dobra kawa i dobre towarzystwo? ☕',a:['Nie','Dobra herbata i towarzystwo','Jeszcze się przekonamy'],r:['Bardzo dobrze. Eksperyment terenowy będzie konieczny. ☕','Herbata też przejdzie. Nie będziemy się kłócić o szczegóły. 🍵','No właśnie… może warto to kiedyś sprawdzić? 👀']}
];
const drinks=['☕ Kawa','🍵 Herbata','🍫 Gorąca czekolada','🎁 Zaskocz mnie'];
const places=['💗 Pink’na Cafe','🦜 Papuga','☕ Pierwsza Kawa','😏 Wybierz za mnie','🤭 Mam lepszy pomysł'];
let stage='intro',qi=0,selected={},dates={},activeDate=null,monthOffset=0,drink='',place='',otherPlace='',sending=false;let customHours={};
const app=document.getElementById('app');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateFmt=k=>new Date(k+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'long'});
const btn=(text,action,disabled=false,cls='')=>`<button class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
const photo=(file,alt,cls='')=>`<img class="photo ${cls}" src="assets/${file}" alt="${alt}" loading="lazy">`;
const back=()=>btn('← Wstecz','back',false,'secondary');
function render(){let h='';if(stage==='intro'){h=`<div class="center"><div class="compass">🧭</div><div class="sparkle">👻💗✨</div><div class="eyebrow">Tylko dla Karoliny</div><h1>Z labiryntu na randkę?</h1><p>Karolina, udało Ci się wyjść z halloweenowego labiryntu… ale wygląda na to, że wpadłaś w kolejny. 👀</p><p>Spokojnie, ten jest trochę przyjemniejszy. Chyba. Najpierw czeka Cię kilka absolutnie naukowych pytań.</p>${btn('Wchodzę w to 👻','start')}</div>`}
else if(stage==='quiz'){let q=questions[qi],s=selected[qi];h=`<div class="eyebrow">Test naukowy • ${qi+1}/7</div><div class="progress">${questions.map((_,i)=>`<span class="${i<=qi?'done':''}"></span>`).join('')}</div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="option ${s===i?'selected':''}" data-answer="${i}">${escapeHtml(a)}</button>`).join('')}${s!==undefined?`<div class="reaction">💬 ${escapeHtml(q.r[s])}${qi===4?photo('auto.jpeg','Tajny agent w samochodzie','small'):''}</div>`:''}<div class="actions">${back()}${btn(qi===6?'Zobacz wynik 💗':'Dalej →','next',s===undefined)}</div>`}
else if(stage==='transition'){h=`<div class="center"><div class="big">🏆</div><h1>Gratulacje, Karolina!</h1><p>Ukończyłaś najbardziej naukowy test w historii internetu.</p><h2>100% cierpliwości do moich głupich pytań 😂</h2><p>Ale spokojnie… to jeszcze nie koniec. Mam dla Ciebie pewną propozycję. 👀❤️</p>${photo('silownia.jpeg','Kandydat do wspólnej kawy','small')}<p class="mini">Kandydat przeszedł kontrolę jakości. Wyniki testu poczucia humoru utajniono. 💪😂</p>${btn('Okej, słucham 😏','calendar')}</div>`}
else if(stage==='calendar'){const today=new Date(),first=new Date(today.getFullYear(),today.getMonth()+monthOffset,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),offset=(first.getDay()+6)%7;const calendar=Array.from({length:Math.ceil((offset+last.getDate())/7)*7},(_,i)=>{const d=i-offset+1;if(d<1||d>last.getDate())return '<span></span>';const obj=new Date(first.getFullYear(),first.getMonth(),d),key=dateKey(obj),past=dateKey(obj)<dateKey(today);return `<button class="day ${dates[key]?'selected':''}" data-date="${key}" ${past?'disabled':''}>${d}</button>`}).join('');h=`<div class="eyebrow">Etap 2 • Tajny kalendarz</div><h2>Kiedy można Cię porwać na kawę? 📅</h2><p>Zaznacz kilka dni, które Ci pasują. Spokojnie, to jeszcze nie rezerwacja ślubu. 💍</p><div class="calendar-head">${btn('‹','prevMonth',monthOffset===0,'secondary')}<b>${first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}</b>${btn('›','nextMonth',monthOffset===5,'secondary')}</div><div class="calendar">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<span class="dayname">${x}</span>`).join('')}${calendar}</div><p class="mini">Kliknij dzień, żeby go zaznaczyć. Następnie wybierz godziny. Możesz wskazać kilka terminów.</p>${activeDate&&dates[activeDate]?`<h3>⏰ ${dateFmt(activeDate)}</h3><div class="slots">${['10:00–12:00','12:00–15:00','15:00–18:00','18:00–21:00'].map(s=>`<button class="option ${(dates[activeDate]||[]).includes(s)?'selected':''}" data-slot="${s}">${s}</button>`).join('')}</div><h3>🖊️ Albo wpisz swoje godziny</h3><p class="mini">Możesz dodać własny przedział dla tego dnia, np. 16:30–19:45. Wybór gotowych godzin nie jest obowiązkowy.</p><div class="time-row"><label>Od<input class="field" type="time" id="timeFrom" value="${escapeHtml((customHours[activeDate]||{}).from||'')}"></label><label>Do<input class="field" type="time" id="timeTo" value="${escapeHtml((customHours[activeDate]||{}).to||'')}"></label><button class="btn secondary" data-action="addTime">+ Dodaj</button></div><p id="time-error" class="error"></p><div class="time-list">${(dates[activeDate]||[]).map(s=>`<button class="chip" data-remove-slot="${escapeHtml(s)}" title="Usuń godzinę">${escapeHtml(s)} ×</button>`).join('')}</div>`:''}${Object.keys(dates).length?`<h3>Twoje propozycje 💗</h3>${Object.keys(dates).sort().map(k=>`<div class="picked" data-focus-date="${k}"><b>${dateFmt(k)}</b><br><span class="mini">${dates[k].length?escapeHtml(dates[k].join(', ')):'Wybierz godziny ↑'}</span></div>`).join('')}`:''}<div class="actions">${back()}${btn('Wybierzmy coś do picia →','drink',!Object.values(dates).some(a=>a.length))}</div>`}
else if(stage==='drink'){h=`<div class="eyebrow">Etap 3 • Poważne decyzje</div><h2>Czym przekupujemy Karolinę? ☕</h2><p>Budżet na przekupstwo jest nieograniczony… no prawie. 😂</p><div class="cardgrid">${drinks.map(x=>`<button class="option ${drink===x?'selected':''}" data-drink="${escapeHtml(x)}"><span class="emoji">${x.split(' ')[0]}</span>${escapeHtml(x.slice(x.indexOf(' ')+1))}</button>`).join('')}</div><div class="actions">${back()}${btn('Wybierzmy miejsce →','place',!drink)}</div>`}
else if(stage==='place'){h=`<div class="eyebrow">Etap 4 • Płock czeka</div><h2>No to gdzie się widzimy? 📍</h2><p>Wybierz miejsce, które brzmi najlepiej. Możesz też oddać wybór w moje ręce. 😏</p>${places.map(x=>`<button class="option ${place===x?'selected':''}" data-place="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}${place===places[4]?`<label for="other">Twój pomysł:</label><input class="field" id="other" maxlength="150" placeholder="Nazwa miejsca lub pomysł…" value="${escapeHtml(otherPlace)}">`:''}<div class="actions">${back()}${btn('Zobacz niespodziankę 👀','warning',!place||(place===places[4]&&!otherPlace.trim()))}</div>`}
else if(stage==='warning'){h=`<div class="warning reveal"><div class="sparkle">🚨💀🚨</div><h2>UWAGA, KAROLINA!</h2><p>Kompas wykrył niebezpieczny kierunek…</p>${photo('spanie.jpeg','Człowiek, który wybrał drzemkę zamiast randki','sleep')}<h3>Tak wygląda życie na autopilocie 😂</h3><p>Można wiecznie zaliczać zgony na kanapie… albo wybrać kawkę i towarzystwo, przy którym nie chce się zasypiać. ☕❤️</p><p><b>Kompas zaleca: skręć w stronę randki! 🧭</b></p>${btn('Dobra, ratujmy sytuację 😂❤️','final')}</div>`}
else if(stage==='summary'||stage==='sending'||stage==='success'){const chosen=Object.keys(dates).sort().filter(k=>dates[k].length).map(k=>`${dateFmt(k)}: ${dates[k].join(', ')}`);h=`<div class="center"><div class="compass">🧭</div><div class="big">${stage==='success'?'🎉':'💌'}</div><div class="eyebrow">Raport końcowy</div><h1>${stage==='success'?'Wiadomość dotarła! 💗':'Misja zakończona! 💗'}</h1><p>Karolina, przetrwałaś siedem absurdalnych pytań, ziemniaczany test osobowości i moje poczucie humoru.</p><p>Teraz pozostaje sprawdzić, czy na żywo dogadujemy się równie dobrze jak w halloweenowym labiryncie. 👻</p>${photo('bluza.jpeg','Autor całej Akcji Kompas')}<p><b>Odnaleziono sprawcę całego zamieszania. To ja. 😂❤️</b></p><p>Kierunek kompasu: Karolina. 🧭</p></div><div class="summary"><b>📅 Proponowane terminy</b>${chosen.map(x=>`<div>${escapeHtml(x)}</div>`).join('')}<div>☕ <b>Napój:</b> ${escapeHtml(drink)}</div><div>📍 <b>Miejsce:</b> ${escapeHtml(place===places[4]?otherPlace:place)}</div></div>${stage==='success'?`<p class="center success">Propozycja została zapisana. Teraz pozostaje uzgodnić szczegóły! ❤️</p>`:`<p class="center"><b>To co, Karolina, widzimy się? 🥹</b><br><span class="mini">To propozycja, nie zobowiązanie. Wyślij tylko, jeśli masz ochotę.</span></p><div class="actions">${back()}${btn(stage==='sending'?'Wysyłanie…':'Wyślij propozycję ❤️','send',stage==='sending')}</div><p id="send-error" class="error" role="alert"></p>`}`}
app.innerHTML=h;}
function previous(){if(stage==='quiz'){if(qi>0)qi--;else stage='intro'}else if(stage==='calendar')stage='transition';else if(stage==='drink')stage='calendar';else if(stage==='place')stage='drink';else if(stage==='summary')stage='warning';else if(stage==='warning')stage='place';render()}
app.addEventListener('input',e=>{if(e.target.id==='timeFrom'||e.target.id==='timeTo'){if(activeDate){customHours[activeDate]??={};customHours[activeDate][e.target.id==='timeFrom'?'from':'to']=e.target.value}}if(e.target.id==='other'){otherPlace=e.target.value;const b=app.querySelector('[data-action="summary"]');if(b)b.disabled=!otherPlace.trim()}});
app.addEventListener('click',e=>{const t=e.target.closest('button,[data-focus-date]');if(!t||t.disabled)return;const a=t.dataset.action;if(t.dataset.answer!==undefined){selected[qi]=Number(t.dataset.answer);render();return}if(t.dataset.date){const k=t.dataset.date;if(dates[k]){delete dates[k];if(activeDate===k)activeDate=null}else{dates[k]=[];activeDate=k}render();return}if(t.dataset.focusDate){activeDate=t.dataset.focusDate;render();return}if(t.dataset.removeSlot){dates[activeDate]=dates[activeDate].filter(x=>x!==t.dataset.removeSlot);render();return}if(t.dataset.slot){const arr=dates[activeDate];const k=t.dataset.slot;dates[activeDate]=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];render();return}if(t.dataset.drink){drink=t.dataset.drink;render();return}if(t.dataset.place){place=t.dataset.place;render();return}if(a==='addTime'){const v=customHours[activeDate]||{};const err=document.getElementById('time-error');if(!v.from||!v.to||v.from>=v.to){err.textContent='Podaj prawidłowe godziny (koniec później niż początek).';return}const range=v.from+'–'+v.to;if(!dates[activeDate].includes(range))dates[activeDate].push(range);customHours[activeDate]={};render();return}if(a==='back'){previous();return}if(a==='start'){stage='quiz';qi=0}else if(a==='next'){if(qi<6)qi++;else stage='transition'}else if(a==='calendar')stage='calendar';else if(a==='prevMonth')monthOffset--;else if(a==='nextMonth')monthOffset++;else if(a==='drink')stage='drink';else if(a==='place')stage='place';else if(a==='warning')stage='warning';else if(a==='final')stage='summary';else if(a==='summary')stage='summary';else if(a==='send'){send();return}render()});
async function send(){if(sending)return;if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')||!SCRIPT_URL.endsWith('/exec')){document.getElementById('send-error').textContent='Strona nie jest jeszcze połączona z arkuszem. Skonfiguruj adres Google Apps Script.';return}const available=Object.keys(dates).sort().filter(k=>dates[k].length).map(date=>({date,hours:dates[date]}));if(!available.length||!drink||!place)return;const payload={type:'akcja-kompas',dates:available,drink,place:place===places[4]?otherPlace:place,answers:questions.map((q,i)=>({question:q.q,answer:q.a[selected[i]]||''}))};sending=true;stage='sending';render();try{const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});const body=await res.json();if(!res.ok||!body.ok)throw Error('Brak potwierdzenia zapisu');stage='success'}catch(err){stage='summary';render();document.getElementById('send-error').textContent='Nie udało się potwierdzić zapisu. Spróbuj ponownie lub skontaktuj się z autorem strony.'}finally{sending=false;render();if(stage==='summary')document.getElementById('send-error').textContent='Nie udało się potwierdzić zapisu. Spróbuj ponownie później.'}}
render();
</script></body></html>
